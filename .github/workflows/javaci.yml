name: Java CI

on:
  - push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up openJDK 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      # Дисплея на раннере нет, поэтому браузер идёт без окна: BaseTest
      # добавляет --headless=new, пока HEADLESS не выставлен в false.
      - name: Run tests and check formatting
        run: ./gradlew test spotlessCheck
      # Отчёт нужен и при падении, иначе смотреть будет нечего.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
