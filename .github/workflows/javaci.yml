name: Java CI

on:
  - push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up openJDK 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          fetch-depth: 0
      # Тесты здесь поднимают настоящий Chrome (new ChromeDriver() без headless)
      # и ходят на example.com, то есть рассчитаны на запуск руками. В CI они
      # требуют браузера и дисплея, поэтому проверяются компиляция и формат.
      # Прогон самих тестов это отдельное решение, вместе с headless-режимом.
      - name: Compile tests and check formatting
        run: ./gradlew testClasses spotlessCheck
